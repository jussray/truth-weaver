name: Run custody merge-review fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-custody-merge-review-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded patch
        run: python scripts/fix-custody-merge-review.py
      - name: Verify bounded patch
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          git diff --check
      - name: Commit bounded patch
        run: |
          git config user.name 'Juss'
          git config user.email '286642846+jussray@users.noreply.github.com'
          git add src/lib/connectors/custody.ts src/lib/connectors/custody.test.ts src/lib/connectors/linear-witness.server.ts
          git diff --cached --quiet && exit 1
          git commit -m 'fix(custody): revalidate authority at provider execution'
          git push origin HEAD:main
