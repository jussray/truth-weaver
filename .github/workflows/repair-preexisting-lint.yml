name: One-time inherited lint repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-preexisting-lint.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair inherited syntax and lint blockers only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text()
          old = '''import {
  BookOpen, Briefcase, CreditCard, FileSignature, FileText, Gavel, Globe2, HeartPulse, Home, Landmark,
  Plane, ShieldCheck, Users, UsersRound, Building2, ArrowRight, CheckCircle2, Rocket,
} , Bookmark, BookmarkCheck, Share2, Check } from "lucide-react";'''
          new = '''import {
  BookOpen, Briefcase, CreditCard, FileSignature, FileText, Gavel, Globe2, HeartPulse, Home, Landmark,
  Plane, ShieldCheck, Users, UsersRound, Building2, ArrowRight, CheckCircle2, Rocket,
  Bookmark, BookmarkCheck, Share2, Check,
} from "lucide-react";'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one malformed import, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/integrations/supabase/previewAuthStorage.ts')
          s = p.read_text()
          old = '''      let timer: ReturnType<typeof setTimeout>;'''
          new = '''      // eslint-disable-next-line prefer-const -- assigned once after listener setup to preserve timeout start order
      let timer: ReturnType<typeof setTimeout>;'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one timer declaration, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/routes/index.tsx src/integrations/supabase/previewAuthStorage.ts
      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Juss'
          git config user.email '286642846+jussray@users.noreply.github.com'
          git add src/routes/index.tsx src/integrations/supabase/previewAuthStorage.ts
          git commit -m 'fix(ci): repair inherited lint blockers'
          git push origin HEAD:main
