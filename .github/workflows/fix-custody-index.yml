name: One-time custody indexed-access type fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-custody-index.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact one-character type assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/connectors/custody.ts')
          s = p.read_text()
          old = 'canonicalizeJson(objectValue[key])'
          new = 'canonicalizeJson(objectValue[key]!)'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one custody index expression, found {count}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/lib/connectors/custody.ts
      - name: Commit bounded type fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Juss'
          git config user.email '286642846+jussray@users.noreply.github.com'
          git add src/lib/connectors/custody.ts
          git diff --cached --quiet && { echo 'No change produced'; exit 1; }
          git commit -m 'fix(custody): satisfy indexed-access type guard'
          git push origin HEAD:main
