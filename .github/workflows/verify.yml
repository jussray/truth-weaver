name: verify

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      require_live_catalog:
        description: "Fail unless the canonical public Shop displays a product"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: truth-weaver-verify-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR or main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Verify checkout fingerprint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Enforce checked-in Bun lockfile
        id: dependencies
        run: |
          test -s bun.lock
          bun install --frozen-lockfile
      - id: founder
        run: bun run verify:founder-intelligence
      - id: design
        run: bun run verify:design-system
      - id: lint
        run: bun run lint
      - id: typecheck
        run: bun run typecheck
      - id: unit
        run: bun run test
      - id: build
        run: bun run build
      - id: browsers
        run: bunx playwright install --with-deps chromium
      - id: e2e
        run: bun run test:e2e
        env:
          TRUTH_WEAVER_LIVE_URL: https://www.truthweaver.jussco.company
          TRUTH_WEAVER_REQUIRE_CATALOG: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_catalog && 'true' || 'false' }}

      - name: Record exact-stage outcomes even when verification fails
        if: always()
        shell: bash
        env:
          OUTCOME_DEPS: ${{ steps.dependencies.outcome }}
          OUTCOME_FOUNDER: ${{ steps.founder.outcome }}
          OUTCOME_DESIGN: ${{ steps.design.outcome }}
          OUTCOME_LINT: ${{ steps.lint.outcome }}
          OUTCOME_TYPECHECK: ${{ steps.typecheck.outcome }}
          OUTCOME_UNIT: ${{ steps.unit.outcome }}
          OUTCOME_BUILD: ${{ steps.build.outcome }}
          OUTCOME_BROWSERS: ${{ steps.browsers.outcome }}
          OUTCOME_E2E: ${{ steps.e2e.outcome }}
          SUBJECT_SHA: ${{ env.EXPECTED_HEAD_SHA }}
          JOB_STATE: ${{ job.status }}
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const names = ["deps","founder","design","lint","typecheck","unit","build","browsers","e2e"];
          const steps = Object.fromEntries(names.map((n) => [n, process.env["OUTCOME_" + n.toUpperCase()] || "not_run"]));
          const data = {
            schema: "juss/ci-step-outcomes@v1",
            commit: process.env.SUBJECT_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            jobState: process.env.JOB_STATE,
            steps,
            operationalOutcomeVerified: false,
            noSecretsCaptured: true
          };
          writeFileSync("artifacts/verify-steps.json", JSON.stringify(data, null, 2) + "\n");
          NODE
      - name: Preserve no-secret step outcome report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verify-step-outcomes-${{ env.EXPECTED_HEAD_SHA }}
          path: artifacts/verify-steps.json
          if-no-files-found: error
          retention-days: 30
