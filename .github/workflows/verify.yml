name: verify

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      require_live_catalog:
        description: "Fail unless the canonical public Shop displays a product"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: truth-weaver-verify-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR or main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Verify checkout fingerprint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Enforce checked-in Bun lockfile
        id: dependencies
        run: |
          test -s bun.lock
          bun install --frozen-lockfile
      - id: founder
        run: bun run verify:founder-intelligence
      - id: cloudflare
        run: bun run verify:cloudflare-runtime
      - id: design
        run: bun run verify:design-system
      - id: lint
        run: bun run lint
      - id: typecheck
        run: bun run typecheck
      - id: unit
        # Run even when lint or typecheck fails, so a lint failure does not hide unit results.
        # Still skipped when the run is cancelled or dependencies did not install.
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun run test
      - id: build
        run: bun run build
      - id: readback
        run: bun run readback:cloudflare-build
      - id: browsers
        run: bunx playwright install --with-deps chromium
      - id: e2e
        run: bun run test:e2e
        env:
          TRUTH_WEAVER_LIVE_URL: https://www.truthweaver.jussco.company
          TRUTH_WEAVER_REQUIRE_CATALOG: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_catalog && 'true' || 'false' }}

      - name: Record exact-stage outcomes even when verification fails
        if: always()
        shell: bash
        env:
          OUTCOME_DEPS: ${{ steps.dependencies.outcome }}
          OUTCOME_FOUNDER: ${{ steps.founder.outcome }}
          OUTCOME_CLOUDFLARE: ${{ steps.cloudflare.outcome }}
          OUTCOME_DESIGN: ${{ steps.design.outcome }}
          OUTCOME_LINT: ${{ steps.lint.outcome }}
          OUTCOME_TYPECHECK: ${{ steps.typecheck.outcome }}
          OUTCOME_UNIT: ${{ steps.unit.outcome }}
          OUTCOME_BUILD: ${{ steps.build.outcome }}
          OUTCOME_READBACK: ${{ steps.readback.outcome }}
          OUTCOME_BROWSERS: ${{ steps.browsers.outcome }}
          OUTCOME_E2E: ${{ steps.e2e.outcome }}
          SUBJECT_SHA: ${{ env.EXPECTED_HEAD_SHA }}
          JOB_STATE: ${{ job.status }}
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const names = ["deps","founder","cloudflare","design","lint","typecheck","unit","build","readback","browsers","e2e"];
          const steps = Object.fromEntries(names.map((n) => [n, process.env["OUTCOME_" + n.toUpperCase()] || "not_run"]));
          const data = {
            schema: "juss/ci-step-outcomes@v1",
            commit: process.env.SUBJECT_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            jobState: process.env.JOB_STATE,
            steps,
            operationalOutcomeVerified: false,
            noSecretsCaptured: true
          };
          writeFileSync("artifacts/verify-steps.json", JSON.stringify(data, null, 2) + "\n");
          NODE
      - name: Preserve no-secret step outcome report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verify-step-outcomes-${{ env.EXPECTED_HEAD_SHA }}
          path: artifacts/verify-steps.json
          if-no-files-found: error
          retention-days: 30
  live-main-audit:
    name: Live main and exact candidate ancestry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live main, current PR head, and ancestry (read-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD_SHA: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          [[ "$current_main" =~ $sha_pattern ]] || { echo "::error::Cannot resolve live main SHA"; exit 1; }
          [[ "$EVENT_HEAD_SHA" =~ $sha_pattern ]] || { echo "::error::Invalid candidate SHA"; exit 1; }
          candidate="$EVENT_HEAD_SHA"
          if [[ -n "$PR_NUMBER" ]]; then
            live_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            live_head="$(jq -r '.head.sha // empty' <<<"$live_pr")"
            live_base="$(jq -r '.base.sha // empty' <<<"$live_pr")"
            live_base_ref="$(jq -r '.base.ref // empty' <<<"$live_pr")"
            [[ "$live_base_ref" == "main" ]] || { echo "::error::PR targets ${live_base_ref}, not main"; exit 1; }
            [[ "$live_head" == "$EVENT_HEAD_SHA" ]] || { echo "::error::PR head advanced; event proof is stale"; exit 1; }
            echo "PR base snapshot: ${live_base}; authoritative comparison uses live main ${current_main}"
            candidate="$live_head"
          fi
          merge_base="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${current_main}...${candidate}" --jq '.merge_base_commit.sha')"
          [[ "$merge_base" == "$current_main" ]] || {
            echo "::error::Candidate is not based on live main ${current_main}. Update the branch and rerun exact-head checks."
            exit 1
          }
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" && "$candidate" != "$current_main" ]]; then
            echo "::error::This main run is superseded by ${current_main}"
            exit 1
          fi
          final_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          [[ "$final_main" == "$current_main" ]] || { echo "::error::Main advanced during audit; evidence expired"; exit 1; }
          if [[ -n "$PR_NUMBER" ]]; then
            final_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
            [[ "$final_head" == "$candidate" ]] || { echo "::error::PR head advanced during audit"; exit 1; }
          fi
          {
            echo "### Live main candidate audit"
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Live main: ${current_main}"
            echo "- Candidate: ${candidate}"
            echo "- Merge base: ${merge_base}"
            echo "- Scope: Git ancestry and exact SHA only; tests, merge authorization, deployment and runtime remain separate."
          } >> "$GITHUB_STEP_SUMMARY"
