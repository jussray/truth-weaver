name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run verify:founder-intelligence
      - run: npm run verify:cloudflare-runtime
      - run: npm run verify:design-system
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run readback:cloudflare-build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          TRUTH_WEAVER_LIVE_URL: https://truthweaver.jussco.company
