name: One-time empty catch repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-empty-catch.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair inherited empty catch only
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path("src/routes/index.tsx"); s=p.read_text(); old="      } catch {}"; new="      } catch (error) { console.warn(\"Bookmark storage unavailable\", error); }"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
          git diff --check
          git diff -- src/routes/index.tsx
      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Juss'
          git config user.email '286642846+jussray@users.noreply.github.com'
          git add src/routes/index.tsx
          git commit -m 'fix(ci): make bookmark storage failure explicit'
          git push origin HEAD:main
